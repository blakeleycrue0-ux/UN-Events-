<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#05070c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Jarvis</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="jarvis.css" />
  </head>
  <body>
    <main class="room">
      <header class="top">
        <div>
          <time id="clock" class="clock">--:--</time>
          <p id="date" class="date"></p>
        </div>
        <button id="openSettings" class="icon-button" aria-label="Ajustes">⚙︎</button>
      </header>

      <section class="core">
        <div id="orb" class="orb" data-state="off" aria-hidden="true"><span></span></div>
        <p id="say" class="say" aria-live="polite">Hola. Pulsa Empezar.</p>
        <p id="heard" class="heard"></p>
      </section>

      <div id="preview" class="preview" hidden>
        <video id="video" autoplay muted playsinline></video>
        <span id="faceState" class="face-state">Buscando caras…</span>
      </div>

      <footer class="bottom">
        <button id="start" class="primary">Empezar</button>
        <button id="talk" class="talk" hidden aria-label="Hablar"><span>🎙️</span>Hablar</button>
        <form id="typeForm" class="type-form" hidden>
          <input id="typeInput" autocomplete="off" placeholder="Escribe una orden…" aria-label="Escribe una orden" />
          <button class="small">Enviar</button>
        </form>
      </footer>
    </main>

    <div id="settings" class="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-head"><h2>Ajustes</h2><button id="closeSettings" class="icon-button" aria-label="Cerrar">✕</button></div>
        <label>Tu nombre<input id="name" maxlength="30" autocomplete="off" /></label>
        <h3>Tu cara</h3>
        <p id="faceInfo" class="muted">Todavía no has registrado tu cara.</p>
        <div class="row">
          <button id="enroll" class="small">Registrar mi cara</button>
          <button id="forget" class="small ghost">Borrar mi cara</button>
        </div>
        <p class="muted">Ponte delante de la cámara, solo, con buena luz. Tu cara se guarda solo en este móvil.</p>
        <label>Cámara<select id="facing"><option value="user">Delantera</option><option value="environment">Trasera</option></select></label>
        <label class="check"><input id="greetOn" type="checkbox" checked /> Saludarme al verme</label>
        <a class="quiet-link" href="/camara">Cámara del jardín</a>
      </div>
    </div>

    <script src="jarvis.js"></script>
  </body>
</html>
