<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Jarvis</title>
    <style>
      body { margin: 0; min-width: 320px; background: #000; color: #f5f5f7; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { padding: 20px; max-width: 460px; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { color: rgba(235, 235, 245, .6); margin: 6px 0 14px; }
      input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: inherit; font: inherit; }
      button { margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 999px; background: #f5f5f7; color: #000; font: inherit; font-weight: 600; cursor: pointer; }
      #state { margin-top: 16px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.06); }
      .ok { color: #30d158; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jarvis para Chromebook</h1>
      <p>Escribe la misma clave de Jarvis que pusiste en el móvil. Deja el Chromebook encendido y con Chrome abierto.</p>
      <input id="key" type="password" placeholder="Clave de Jarvis" autocomplete="off" />
      <button id="save">Guardar y conectar</button>
      <div id="state">Sin conectar</div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
